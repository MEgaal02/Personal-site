# Eclypso Software Limited — eclypsosoftware.com

[build]
  publish = "."

# ─── Old brand → new brand ────────────────────────────────────────────────
# builtbyegaal.com must be attached to this site as a domain alias for these
# to fire. Netlify already 301s aliases to the primary domain, but that costs
# two hops (http alias → https alias → https primary), which search engines
# discount. These rules collapse it to one hop and preserve the path.

[[redirects]]
  from = "http://builtbyegaal.com/*"
  to = "https://eclypsosoftware.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://builtbyegaal.com/*"
  to = "https://eclypsosoftware.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.builtbyegaal.com/*"
  to = "https://eclypsosoftware.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.builtbyegaal.com/*"
  to = "https://eclypsosoftware.com/:splat"
  status = 301
  force = true

# ─── Correct MIME type for the web app manifest ───────────────────────────
# Netlify serves .webmanifest as application/octet-stream by default, which
# makes Chrome ignore the icon set.

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# ─── Asset caching ────────────────────────────────────────────────────────
# Images and media get a week in the browser plus a day of grace; the CDN
# revalidates on deploy. HTML stays un-cached (Netlify default) so pages
# update instantly.

[[headers]]
  for = "/projects-content/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/builtbyeveryscreen/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/desktop-app thumbs for project page/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/advert-video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
